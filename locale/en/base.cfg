[mod-setting-name]
  mhh-jumpstart-preset=Starting equipment preset
  mhh-jumpstart-quality=Starting item quality
  mhh-jumpstart-starter-items=Starter factory items

[mod-setting-description]
  mhh-jumpstart-preset=Which set of items and equipment to receive at game start.
  mhh-jumpstart-quality=Quality level of all items and equipment given at game start. Requires Quality or Space Age to be active, otherwise defaults to Normal.
  mhh-jumpstart-starter-items=Whether to also receive starter factory items (belts, inserters, assemblers, furnaces, miners, poles, pipes, chests). Separate from the main preset so you can mix and match.

[mod-setting-values]
  mhh-jumpstart-preset-balanced=Balanced — vanilla power armor, no bots, no prototype gear
  mhh-jumpstart-preset-advanced=Advanced — tier-2 armor, 50 bots, no science packs
  mhh-jumpstart-preset-overpowered=Overpowered — full prototype grid, 500 bots, roboport
  mhh-jumpstart-preset-cheaty=Cheaty — everything, full prototype grid
  mhh-jumpstart-quality-normal=Normal
  mhh-jumpstart-quality-uncommon=Uncommon
  mhh-jumpstart-quality-rare=Rare
  mhh-jumpstart-quality-epic=Epic
  mhh-jumpstart-quality-legendary=Legendary
  mhh-jumpstart-starter-items-none=None — no starter factory items
  mhh-jumpstart-starter-items-balanced=Balanced — basic starter kit: 50 belts, 20 inserters, 5 assemblers, 4 furnaces, 4 miners, poles, pipes, boiler+steam engine, chests
  mhh-jumpstart-starter-items-advanced=Advanced — generous kit: 200 belts, 50 inserters, 10 assemblers, 8 steel furnaces, 8 miners, poles, pipes, chests
  mhh-jumpstart-starter-items-overpowered=Overpowered — red belts: 500 fast belts, 100 inserters (mix, K2: superior), 20 assemblers, 16 steel furnaces, 16 miners, poles, pipes, solar, accumulators, chests
  mhh-jumpstart-starter-items-cheaty=Cheaty — blue belts: 1000 express belts, 400 inserters (all types, K2: superior), 50 assemblers, 32 electric furnaces, 32 miners, substations, pipes, solar, accumulators, chests