[mod-setting-name]
  mhh-jumpstart-preset=Starting equipment preset
  mhh-jumpstart-quality=Starting item quality

[mod-setting-description]
  mhh-jumpstart-preset=Which set of items and equipment to receive at game start.
  mhh-jumpstart-quality=Quality level of all items and equipment given at game start. Requires Quality or Space Age to be active, otherwise defaults to Normal.

[mod-setting-values]
  mhh-jumpstart-preset-balanced=Balanced — vanilla power armor, no bots, no prototype gear
  mhh-jumpstart-preset-advanced=Advanced — tier-2 armor, 50 bots, no science packs
  mhh-jumpstart-preset-overpowered=Overpowered — full prototype grid, 500 bots, roboport
  mhh-jumpstart-preset-cheaty=Cheaty — everything, full prototype grid
  mhh-jumpstart-quality-normal=Normal
  mhh-jumpstart-quality-uncommon=Uncommon
  mhh-jumpstart-quality-rare=Rare
  mhh-jumpstart-quality-epic=Epic
  mhh-jumpstart-quality-legendary=Legendary